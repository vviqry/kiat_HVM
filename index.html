<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Up Realistis</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 0; /* Hapus padding agar nempel ke atas dan bawah layar */
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 100px; 
        }

        img {
            max-width: 100%;
            height: 100vh; 
            object-fit: contain; 
        }

        /* Floating Button Abu-abu Transparan */
        #fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background-color: rgba(128, 128, 128, 0.5); 
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <img id="firstImg" src="hvm2.png" alt="Bagian Atas">
    <img src="hvm.png" alt="6 Langkah Glow Up Realistis">
    <img id="lastImg" src="transisitobesigma.png" alt="Transisi to Sigma">

    <button id="fab">↓</button>

    <script>
        const fab = document.getElementById('fab');
        const firstImg = document.getElementById('firstImg');
        const lastImg = document.getElementById('lastImg');

        // 1. Klik kiri untuk auto scroll ke gambar terakhir
        fab.addEventListener('click', () => {
            lastImg.scrollIntoView({ behavior: 'smooth' });
        });

        // 2. Tampilkan FAB hanya saat gambar pertama (hvm2.png) terlihat di layar
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                fab.style.opacity = '1';
                fab.style.pointerEvents = 'auto'; // Tombol bisa diklik
            } else {
                fab.style.opacity = '0';
                fab.style.pointerEvents = 'none'; // Tombol nonaktif saat hilang
            }
        }, { threshold: 0.1 }); 
        
        observer.observe(firstImg);

        // 3. Fitur Drag and Drop dengan Klik Kanan
        let isDragging = false;
        let offsetX, offsetY;

        fab.addEventListener('mousedown', (e) => {
            if (e.button === 2) { // e.button === 2 adalah klik kanan
                isDragging = true;
                const rect = fab.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                fab.style.cursor = 'grabbing';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                // Hapus posisi fixed right dan bottom bawaan CSS agar bebas bergerak
                fab.style.bottom = 'auto';
                fab.style.right = 'auto';
                
                fab.style.left = (e.clientX - offsetX) + 'px';
                fab.style.top = (e.clientY - offsetY) + 'px';
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (e.button === 2 && isDragging) {
                isDragging = false;
                fab.style.cursor = 'pointer';
            }
        });

        // 4. Cegah menu default klik kanan muncul di tombol
        fab.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>

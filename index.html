<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Up Realistis</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            overflow: hidden; /* Tetap tanpa scrollbar */
            display: flex;
            flex-direction: column; /* Menyusun elemen dari atas ke bawah */
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 10px; /* Jarak antara gambar atas dan bawah */
        }

        img {
            max-width: 100vw;
            max-height: 48vh; /* Dibagi agar kedua gambar muat di 1 layar */
            object-fit: contain; 
        }
    </style>
</head>
<body>
    <img src="hvm2.png" alt="Bagian Atas">
    <img src="hvm.png" alt="6 Langkah Glow Up Realistis">
</body>
</html>

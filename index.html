<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Up Realistis</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 100px; /* Jarak antar gambar */
            /* Padding atas-bawah dihapus agar gambar nempel ke tepi */
        }

        img {
            max-width: 100%;
            height: 100vh; 
            object-fit: contain; 
        }

        /* Styling Floating Button */
        #floatBtn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 12px 20px;
            background-color: #ffcc00;
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 9999;
            user-select: none;
            box-shadow: 0 4px 10px rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <img src="hvm2.png" alt="Bagian Atas">
    <img src="hvm.png" alt="6 Langkah Glow Up Realistis">
    <!-- Gambar terakhir ditambahkan ID untuk target scroll -->
    <img src="transisitobesigma.png" alt="Transisi Sigma" id="gambarTerakhir">

    <button id="floatBtn">Scroll ke Sigma ⬇️</button>

    <script>
        const btn = document.getElementById('floatBtn');
        const targetImg = document.getElementById('gambarTerakhir');

        // 1. Fitur Scroll ke bawah saat klik kiri
        btn.addEventListener('click', (e) => {
            // Pastikan bukan klik kanan
            if(e.button === 0) { 
                targetImg.scrollIntoView({ behavior: 'smooth' });
            }
        });

        // 2. Fitur Drag & Drop dengan Klik Kanan Tahan
        let isDragging = false;
        let offsetX, offsetY;

        btn.addEventListener('mousedown', (e) => {
            if (e.button === 2) { // 2 adalah kode untuk klik kanan
                isDragging = true;
                offsetX = e.clientX - btn.getBoundingClientRect().left;
                offsetY = e.clientY - btn.getBoundingClientRect().top;
                btn.style.cursor = 'grabbing';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                // Hapus properti bottom/left bawaan agar posisinya mengikuti mouse (top/left)
                btn.style.bottom = 'auto'; 
                btn.style.right = 'auto';
                btn.style.left = (e.clientX - offsetX) + 'px';
                btn.style.top = (e.clientY - offsetY) + 'px';
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (e.button === 2) {
                isDragging = false;
                btn.style.cursor = 'pointer';
            }
        });

        // Mencegah munculnya menu klik kanan (context menu) pada tombol ini
        btn.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
